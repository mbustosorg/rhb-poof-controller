<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 640" width="1300" height="640" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
  </defs>
  <style>
    .box { fill: #f6f6f6; stroke: #222; stroke-width: 2; }
    .wire { fill: none; stroke-width: 2.5; stroke-linejoin: round; }
    .v12 { stroke: #c0392b; }
    .gnd12 { stroke: #222; }
    .mains { stroke: #7f8c8d; stroke-dasharray: 0; }
    .v5 { stroke: #8e44ad; }
    .v33 { stroke: #e67e22; }
    .gnd { stroke: #222; }
    .sig { stroke: #2471a3; }
    .i2c { stroke: #1e8449; }
    .part { fill: #fff; stroke: #222; stroke-width: 2; }
    .sym { fill: none; stroke: #222; stroke-width: 2; }
    .lbl { fill: #222; }
    .ref { fill: #222; font-weight: bold; }
    .val { fill: #555; font-size: 13px; }
    .pin { fill: #222; font-size: 13px; }
    .title { fill: #222; font-size: 20px; font-weight: bold; }
    .note { fill: #555; font-size: 12px; font-style: italic; }
    .dot { fill: #222; }
  </style>

  <rect x="0" y="0" width="1300" height="640" fill="#ffffff"/>
  <text x="650" y="30" text-anchor="middle" class="title">RHB poof controller circuit</text>

  <!-- The carrier board: everything inside is on the PCB in kicad/ -->
  <rect x="418" y="95" width="672" height="425" rx="10" fill="none" stroke="#2471a3" stroke-width="1.5" stroke-dasharray="10 6"/>
  <text x="430" y="114" class="note" fill="#2471a3">carrier board (kicad/)</text>

  <!-- Isolation barrier through the optocoupler -->
  <line x1="680" y1="110" x2="680" y2="300" stroke="#999" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="670" y="125" text-anchor="end" class="note">12V side</text>
  <text x="690" y="125" class="note">3.3V side</text>
  <text x="680" y="318" text-anchor="middle" class="note">isolation, no shared ground</text>

  <!-- 120V generator and the two supplies -->
  <rect x="40" y="50" width="160" height="44" rx="6" class="box"/>
  <text x="120" y="77" text-anchor="middle" class="lbl">120V generator</text>
  <path d="M120,94 V160" class="wire mains"/>
  <path d="M40,72 H20 V570 H40" class="wire mains"/>
  <text x="128" y="132" class="val">120V AC</text>

  <rect x="40" y="160" width="160" height="90" rx="6" class="box"/>
  <text x="120" y="200" text-anchor="middle" class="lbl">12V supply</text>
  <text x="120" y="218" text-anchor="middle" class="val">120V AC in</text>
  <text x="190" y="189" text-anchor="end" class="pin">+</text>
  <text x="190" y="240" text-anchor="end" class="pin">−</text>

  <rect x="40" y="540" width="160" height="60" rx="6" class="box"/>
  <text x="120" y="566" text-anchor="middle" class="lbl">PoE switch</text>
  <text x="120" y="584" text-anchor="middle" class="val">802.3af, 120V AC in</text>

  <!-- 12V +: fuse, button, resistor, to opto anode -->
  <path d="M200,185 H235" class="wire v12"/>
  <rect x="235" y="177" width="50" height="16" class="part"/>
  <line x1="235" y1="185" x2="285" y2="185" class="sym" stroke-width="1.5"/>
  <text x="260" y="168" text-anchor="middle" class="ref">F1</text>
  <text x="260" y="212" text-anchor="middle" class="val">250 mA</text>
  <text x="260" y="150" text-anchor="middle" class="note">inline, at the supply</text>
  <path d="M285,185 H325" class="wire v12"/>

  <!-- SW1 momentary N.O. pushbutton -->
  <circle cx="330" cy="185" r="4" class="part"/>
  <circle cx="380" cy="185" r="4" class="part"/>
  <line x1="322" y1="170" x2="388" y2="170" class="sym"/>
  <line x1="355" y1="170" x2="355" y2="152" class="sym"/>
  <line x1="345" y1="152" x2="365" y2="152" class="sym"/>
  <text x="355" y="140" text-anchor="middle" class="ref">SW1</text>
  <text x="355" y="212" text-anchor="middle" class="val">poof button</text>
  <text x="355" y="228" text-anchor="middle" class="val">momentary N.O.</text>
  <path d="M384,185 H448" class="wire v12"/>

  <!-- J1 screw terminal, where the 12V wires enter the carrier -->
  <rect x="418" y="178" width="14" height="14" class="part"/>
  <rect x="418" y="228" width="14" height="14" class="part"/>
  <text x="425" y="168" text-anchor="middle" class="ref">J1</text>
  <text x="425" y="208" text-anchor="middle" class="pin">BTN</text>
  <text x="425" y="258" text-anchor="middle" class="pin">12V−</text>

  <!-- R1 -->
  <rect x="448" y="177" width="56" height="16" class="part"/>
  <text x="476" y="150" text-anchor="middle" class="ref">R1</text>
  <text x="476" y="168" text-anchor="middle" class="val">2.2k ¼W</text>
  <path d="M504,185 H600" class="wire v12"/>
  <circle cx="545" cy="185" r="4" class="dot"/>

  <!-- 12V − to opto cathode -->
  <path d="M200,235 H600" class="wire gnd12"/>
  <circle cx="545" cy="235" r="4" class="dot"/>

  <!-- D1, reversed across the opto LED: cathode up to the anode node -->
  <path d="M545,185 V197" class="wire v12"/>
  <path d="M545,223 V235" class="wire gnd12"/>
  <polygon points="533,223 557,223 545,201" class="part"/>
  <line x1="533" y1="199" x2="557" y2="199" class="sym"/>
  <text x="527" y="206" text-anchor="end" class="ref">D1</text>
  <text x="527" y="222" text-anchor="end" class="val">1N4148</text>

  <!-- U1 PC817 -->
  <rect x="600" y="160" width="160" height="100" rx="4" class="box"/>
  <text x="680" y="152" text-anchor="middle" class="ref">U1 PC817</text>
  <text x="606" y="178" class="pin">1</text>
  <text x="606" y="254" class="pin">2</text>
  <text x="754" y="178" text-anchor="end" class="pin">4</text>
  <text x="754" y="254" text-anchor="end" class="pin">3</text>
  <!-- LED -->
  <path d="M600,185 H640 V199" class="sym"/>
  <polygon points="629,199 651,199 640,219" class="part"/>
  <line x1="629" y1="219" x2="651" y2="219" class="sym"/>
  <path d="M640,219 V235 H600" class="sym"/>
  <line x1="655" y1="203" x2="680" y2="203" class="sym" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="655" y1="215" x2="680" y2="215" class="sym" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Phototransistor -->
  <line x1="700" y1="194" x2="700" y2="226" class="sym" stroke-width="3"/>
  <path d="M700,202 L725,190 V185 H760" class="sym"/>
  <path d="M700,218 L725,230 V235 H760" class="sym"/>
  <line x1="712" y1="224" x2="724" y2="230" class="sym" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Opto output to the Pico -->
  <path d="M760,185 H880" class="wire sig"/>
  <path d="M760,235 H880" class="wire gnd"/>
  <text x="820" y="177" text-anchor="middle" class="val">low = pressed</text>

  <!-- Pico W -->
  <rect x="880" y="150" width="180" height="310" rx="8" class="box"/>
  <text x="970" y="285" text-anchor="middle" class="lbl" font-size="16" font-weight="bold">ESP32-S3-</text>
  <text x="970" y="303" text-anchor="middle" class="lbl" font-size="16" font-weight="bold">POE-ETH</text>
  <text x="970" y="323" text-anchor="middle" class="val">CircuitPython</text>
  <text x="970" y="341" text-anchor="middle" class="val">192.168.1.15, wired</text>
  <text x="888" y="190" class="pin">IO40 (11)</text>
  <text x="888" y="206" class="note">internal pull-up</text>
  <text x="888" y="240" class="pin">GND (13)</text>
  <text x="1052" y="375" text-anchor="end" class="pin">3V3 (36)</text>
  <text x="1052" y="405" text-anchor="end" class="pin">GND (38)</text>
  <text x="1052" y="230" text-anchor="end" class="pin">IO39 SDA (12)</text>
  <text x="1052" y="260" text-anchor="end" class="pin">IO38 SCL (14)</text>
  <circle cx="900" cy="425" r="6" fill="#e74c3c" stroke="#222" stroke-width="1.5"/>
  <text x="912" y="429" class="note">RGB LED, red</text>
  <text x="912" y="445" class="note">lit while pressed</text>

  <!-- 5V USB into the Pico -->
  <path d="M200,570 H970 V460" class="wire v5"/>
  <text x="960" y="490" text-anchor="end" class="val">RJ45, Ethernet + PoE</text>

  <!-- Display -->
  <rect x="1130" y="190" width="140" height="240" rx="6" class="box"/>
  <text x="1200" y="282" text-anchor="middle" class="lbl" font-weight="bold">HT16K33</text>
  <text x="1200" y="299" text-anchor="middle" class="val">4 digit, I2C 0x70</text>
  <rect x="1150" y="308" width="100" height="34" rx="3" fill="#222"/>
  <text x="1200" y="333" text-anchor="middle" fill="#e74c3c" font-family="Courier New, monospace" font-size="22" font-weight="bold">82 41</text>
  <text x="1175" y="357" text-anchor="middle" class="note">psi</text>
  <text x="1225" y="357" text-anchor="middle" class="note">°F</text>
  <text x="1138" y="229" class="pin">D</text>
  <text x="1138" y="259" class="pin">C</text>

  <path d="M1060,225 H1130" class="wire i2c"/>
  <path d="M1060,255 H1130" class="wire i2c"/>
  <path d="M1060,370 H1130" class="wire v33"/>
  <text x="1138" y="375" class="pin">+</text>
  <path d="M1060,400 H1130" class="wire gnd"/>
  <text x="1138" y="405" class="pin">−</text>
  <text x="1200" y="455" text-anchor="middle" class="note">run from 3V3, not 5V</text>

  <!-- J2, the display connector on the carrier's edge -->
  <rect x="1083" y="218" width="14" height="14" class="part"/>
  <rect x="1083" y="248" width="14" height="14" class="part"/>
  <rect x="1083" y="363" width="14" height="14" class="part"/>
  <rect x="1083" y="393" width="14" height="14" class="part"/>
  <text x="1090" y="208" text-anchor="middle" class="ref">J2</text>

  <!-- Legend -->
  <g transform="translate(40,300)">
    <text x="0" y="0" class="lbl" font-weight="bold">Wires</text>
    <line x1="0" y1="20" x2="30" y2="20" class="wire v12"/><text x="40" y="25" class="val">12V +</text>
    <line x1="0" y1="42" x2="30" y2="42" class="wire gnd12"/><text x="40" y="47" class="val">ground (12V side and board side are separate)</text>
    <line x1="0" y1="64" x2="30" y2="64" class="wire v5"/><text x="40" y="69" class="val">Ethernet + PoE</text>
    <line x1="0" y1="86" x2="30" y2="86" class="wire v33"/><text x="40" y="91" class="val">3.3V</text>
    <line x1="0" y1="108" x2="30" y2="108" class="wire sig"/><text x="40" y="113" class="val">button signal</text>
    <line x1="0" y1="130" x2="30" y2="130" class="wire i2c"/><text x="40" y="135" class="val">I2C</text>
    <line x1="0" y1="152" x2="30" y2="152" class="wire mains"/><text x="40" y="157" class="val">120V AC</text>
  </g>
</svg>
